<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADAT ZONE | متجر الحسابات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --primary: #3b82f6; --accent: #8b5cf6; --text: #f8fafc; --text-muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text); padding-bottom: 80px; }
        header { background: rgba(30, 41, 59, 0.9); position: sticky; top: 0; z-index: 100; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--primary); text-decoration: none; }
        .cart-trigger { background: #334155; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; }
        .card { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #334155; display: flex; flex-direction: column; justify-content: space-between; }
        .card-img { width: 100%; height: 160px; object-fit: cover; }
        .card-body { padding: 1.2rem; flex-grow: 1; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding: 0 1.2rem 1.2rem; }
        .price { font-size: 1.2rem; font-weight: bold; color: #10b981; }
        .btn { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">👑 SADAT ZONE</a>
        <button class="cart-trigger" onclick="alert('افتح السلة من الزر المخصص')">🛒 السلة</button>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 1.5rem;">🎮 جميع المنتجات والحسابات</h2>
        <div class="grid" id="productsGrid">
            <p>جاري تحميل المنتجات...</p>
        </div>
    </div>

    <script>
        // ضع بيانات Supabase الخاصة بك هنا
        const SUPABASE_URL = "ضع_رابط_المشروع_هنا";
        const SUPABASE_KEY = "ضع_مفتاح_ANON_KEY_هنا";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadProducts() {
            const { data: products, error } = await supabaseClient.from('products').select('*');
            const grid = document.getElementById('productsGrid');
            
            if (error || !products) {
                grid.innerHTML = '<p>حدث خطأ أثناء تحميل المنتجات.</p>';
                return;
            }

            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${p.image_url || 'https://via.placeholder.com/300x160'}" class="card-img" alt="${p.title}">
                        <div class="card-body">
                            <h3>${p.title}</h3>
                            <p style="color:var(--text-muted); font-size:0.85rem;">${p.description}</p>
                        </div>
                        <div class="card-footer">
                            <span class="price">${p.price} ج.م</span>
                            <button class="btn" onclick="buy('${p.title}', ${p.price})">شراء الآن</button>
                        </div>
                    </div>
                `;
            });
        }

        function buy(title, price) {
            const msg = `مرحباً، أريد شراء ${title} بسعر ${price} ج.م من متجر Sadat Zone`;
            window.open(`https://wa.me/2010411808181?text=${encodeURIComponent(msg)}`, '_blank');
        }

        loadProducts();
    </script>
</body>
</html>
