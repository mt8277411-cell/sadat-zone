<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADAT ZONE - Game Accounts & Digital Services</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #070913;
            color: #ffffff;
            padding: 20px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية نيون متحركة */
        body::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(245, 158, 11, 0.05) 50%, transparent 70%);
            z-index: -1;
            filter: blur(50px);
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* Header / Nav */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .cart-btn {
            background: rgba(26, 34, 54, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .cart-btn:hover {
            border-color: rgba(245, 158, 11, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(245, 158, 11, 0.15);
        }

        .cart-badge {
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: #000;
            font-weight: 900;
            padding: 2px 7px;
            border-radius: 50%;
            font-size: 11px;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        /* اسم المتجر بخط كبير وتأثير نيون مضيء */
        .brand-nav {
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #fff 20%, #f59e0b 60%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
            animation: neonPulse 3s ease-in-out infinite alternate;
        }

        @keyframes neonPulse {
            0% { filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.4)); }
            100% { filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.8)); }
        }

        /* Hero Section */
        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .crown-icon {
            font-size: 45px;
            margin-bottom: 8px;
            animation: floatCrown 3s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.4));
        }

        @keyframes floatCrown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .hero h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #fff 30%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }

        .hero h2 {
            font-size: 13px;
            background: linear-gradient(90deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 13px;
            color: #9ca3af;
            line-height: 1.6;
            padding: 0 10px;
        }

        /* Features Badges */
        .features {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .feature-row {
            display: flex;
            gap: 12px;
        }

        .feature-badge {
            background: rgba(19, 27, 46, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #e5e7eb;
            flex: 1;
            transition: all 0.3s ease;
        }

        .feature-badge:hover {
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.15);
        }

        .feature-badge.full-width {
            width: 100%;
        }

        /* Search Section */
        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #f3f4f6;
        }

        .search-box {
            position: relative;
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            background: rgba(19, 27, 46, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px 18px 14px 45px;
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.25);
            background: rgba(19, 27, 46, 0.9);
        }

        .search-box svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: #6b7280;
        }

        /* Product Card */
        .product-card {
            background: linear-gradient(145deg, rgba(19, 27, 46, 0.8), rgba(11, 15, 25, 0.9));
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: rgba(245, 158, 11, 0.4);
            box-shadow: 0 15px 35px rgba(245, 158, 11, 0.15);
        }

        .product-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-name {
            font-size: 17px;
            font-weight: 800;
            color: #fff;
        }

        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: #f59e0b;
            margin-top: 4px;
        }

        .tag-new {
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: #000;
            font-weight: 900;
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 20px;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }

        .product-image-placeholder {
            width: 100%;
            height: 180px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
        }

        .product-actions {
            padding: 16px;
        }

        .add-fast-btn {
            width: 100%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .add-fast-btn:hover {
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: #000;
            border-color: transparent;
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
            transform: scale(1.02);
        }

        /* تصميم نافذة سلة الشراء (Cart Drawer) */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: flex-end;
            z-index: 1000;
        }

        .cart-drawer {
            width: 100%;
            max-width: 380px;
            background: #0f172a;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .cart-header h3 {
            font-size: 18px;
            font-weight: 800;
        }

        .close-cart {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-info h4 {
            font-size: 14px;
            font-weight: 700;
        }

        .cart-item-info p {
            font-size: 12px;
            color: #f59e0b;
        }

        .remove-item {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .cart-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            margin-top: 15px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <button class="cart-btn" onclick="toggleCart()">
                <span>السلة</span>
                <span class="cart-badge" id="cartCount">0</span>
                🛒
            </button>
            <div class="brand-nav">
                <span>SADAT ZONE</span>
                👑
            </div>
        </header>

        <!-- Hero Section -->
        <div class="hero">
            <div class="crown-icon">👑</div>
            <h1>SADAT ZONE</h1>
            <h2>GAME ACCOUNTS & DIGITAL SERVICES</h2>
            <p>حسابات ألعاب متكاملة | أكواد أصلية | تسليم فوري وآمن</p>
        </div>

        <!-- Features -->
        <div class="features">
            <div class="feature-row">
                <div class="feature-badge">⚡ تسليم فوري تلقائي</div>
                <div class="feature-badge">🛡️ ضمان أمان 100%</div>
            </div>
            <div class="feature-badge full-width">💬 دعم فني مباشر 24/7</div>
        </div>

        <!-- Search & Products -->
        <div class="section-title">🔥 أحدث المنتجات والعروض</div>

        <div class="search-box">
            <input type="text" placeholder="ابحث عن لعبتك المفضلة...">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>

        <!-- Product Item -->
        <div class="product-card">
            <div class="product-header">
                <div>
                    <div class="product-name">Forza Horizon 6</div>
                    <div class="product-price">25$</div>
                </div>
                <div class="tag-new">🔥 جديد</div>
            </div>
            <div class="product-image-placeholder">
                <span>[صورة اللعبة أو الغلاف]</span>
            </div>
            <div class="product-actions">
                <button class="add-fast-btn" onclick="addToCart('Forza Horizon 6', 25)">
                    ⚡ إضافة سريعة
                </button>
            </div>
        </div>

    </div>

    <!-- نافذة سلة الشراء (Drawer) -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart(event)">
        <div class="cart-drawer" onclick="event.stopPropagation()">
            <div class="cart-header">
                <h3>سلة المشتريات</h3>
                <button class="close-cart" onclick="toggleCart()">✕</button>
            </div>
            <div class="cart-items" id="cartItemsContainer">
                <p style="text-align: center; color: #64748b; margin-top: 40px;">السلة فارغة حالياً</p>
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>الإجمالي:</span>
                    <span id="cartTotalPrice">0$</span>
                </div>
                <button class="checkout-btn" onclick="alert('تم إتمام الطلب بنجاح!')">إتمام الطلب 🚀</button>
            </div>
        </div>
    </div>

    <script>
        let cart = [];

        function toggleCart(event) {
            if (event && event.target !== document.getElementById('cartOverlay') && event.target.className !== 'close-cart' && event.target.tagName !== 'BUTTON') return;
            const overlay = document.getElementById('cartOverlay');
            overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
            // فتح السلة تلقائياً عند الإضافة (اختياري)
            document.getElementById('cartOverlay').style.display = 'flex';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const countBadge = document.getElementById('cartCount');
            const container = document.getElementById('cartItemsContainer');
            const totalPriceElem = document.getElementById('cartTotalPrice');

            countBadge.innerText = cart.length;

            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #64748b; margin-top: 40px;">السلة فارغة حالياً</p>';
                totalPriceElem.innerText = '0$';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.name}</h4>
                            <p>${item.price}$</p>
                        </div>
                        <button class="remove-item" onclick="removeFromCart(${index})">حذف</button>
                    </div>
                `;
            });

            container.innerHTML = html;
            totalPriceElem.innerText = total + '$';
        }
    </script>

</body>
</html>
