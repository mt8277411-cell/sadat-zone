<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر FiveM للألعاب والحسابات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --main-color: #ff4757;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--main-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .discord-btn {
            background-color: #5865F2;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .discord-btn:hover {
            background-color: #4752C4;
        }

        .cart-icon {
            position: relative;
            font-size: 22px;
            cursor: pointer;
            background: #334155;
            padding: 10px;
            border-radius: 8px;
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--main-color);
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 12px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            margin-bottom: 20px;
            border-right: 4px solid var(--main-color);
            padding-right: 10px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #000;
        }

        .product-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .product-price {
            font-size: 20px;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .add-btn {
            width: 100%;
            background-color: var(--main-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .add-btn:hover {
            background-color: #ff2e43;
        }

        /* Modal السلة والدفع */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            width: 90%;
            max-width: 550px;
            border-radius: 12px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .close-btn {
            font-size: 24px;
            cursor: pointer;
            color: #94a3b8;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            gap: 10px;
        }

        .cart-item img {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .qty-btn {
            background: none;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            width: 20px;
        }

        .payment-methods {
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
        }

        .payment-option {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #334155;
            border-radius: 6px;
        }

        .pay-number {
            color: var(--accent-color);
            font-weight: bold;
            direction: ltr;
            display: inline-block;
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-gamepad"></i> FiveM Store
        </div>
        <div class="nav-links">
            <a href="https://discord.gg/fYkwhjG3ns" target="_blank" class="discord-btn">
                <i class="fa-brands fa-discord"></i> الديسكورد
            </a>
            <div class="cart-icon" onclick="toggleCart()">
                <i class="fa-solid fa-shopping-cart"></i>
                <span class="cart-count" id="cartCount">0</span>
            </div>
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">حسابات وسلات FiveM</h2>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- نافذة السلة والدفع -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>سلة المشتريات</h3>
                <span class="close-btn" onclick="toggleCart()">&times;</span>
            </div>
            
            <div id="cartItems"></div>
            
            <div style="margin-top: 15px; font-weight: bold; font-size: 18px;">
                الإجمالي: <span id="cartTotal" style="color: var(--accent-color);">0</span> جنيه
            </div>

            <div class="payment-methods">
                <h4>طرق الدفع المتاحة:</h4>
                <div class="payment-option">
                    <strong>فودافون كاش:</strong> <span class="pay-number">01041180818</span>
                </div>
                <div class="payment-option">
                    <strong>إنستا باي (InstaPay):</strong> <span class="pay-number">01018950662</span>
                </div>
                <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">
                    * بعد التحويل، يرجى الاحتفاظ بلقطة الشاشة (Screenshot) لتقديمها في الديسكورد.
                </p>
            </div>

            <button class="checkout-btn" onclick="sendOrder()">تأكيد وإرسال الطلب عبر الديسكورد</button>
        </div>
    </div>

    <script>
        // قائمة المنتجات بالأسعار الجديدة
        const products = [
            { id: 1, name: "سلة حسابات FiveM (عادي)", price: 250, desc: "حساب GTA V مفعل وجاهز للعب مباشرة في السيرفرات.", image: "https://via.placeholder.com/300x180/1e293b/ffffff?text=FiveM+Basic" },
            { id: 2, name: "سلة حسابات FiveM (مميز/Clean)", price: 450, desc: "حساب نظيف 100% بدون أي بان أو قيود سابقة.", image: "https://via.placeholder.com/300x180/1e293b/ffffff?text=FiveM+Clean" },
            { id: 3, name: "سلة رتب وميزات VIP", price: 300, desc: "رتبة VIP داخل سيرفر الديسكورد مع أولوية دخول السيرفر.", image: "https://via.placeholder.com/300x180/1e293b/ffffff?text=VIP+Role" },
            { id: 4, name: "سلة فلوس وسيارات داخل السيرفر", price: 180, desc: "باقة حصرية للبدء بسيارة ممتازة ورصيد مالي متكامل.", image: "https://via.placeholder.com/300x180/1e293b/ffffff?text=InGame+Pack" }
        ];

        // مصفوفة السلة المحدثة للتخزين الفعال
        let cart = {};

        // عرض المنتجات
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.image}" class="product-img" alt="${p.name}">
                    <div class="product-info">
                        <div>
                            <div class="product-title">${p.name}</div>
                            <div class="product-desc">${p.desc}</div>
                        </div>
                        <div>
                            <div class="product-price">${p.price} ج.م</div>
                            <button class="add-btn" onclick="addToCart(${p.id})">
                                <i class="fa-solid fa-cart-plus"></i> إضافة للسلة
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // إضافة منتج للسلة أو زيادة الكمية
        function addToCart(id) {
            if (cart[id]) {
                cart[id].qty += 1;
            } else {
                const product = products.find(p => p.id === id);
                cart[id] = { ...product, qty: 1 };
            }
            updateCart();
        }

        // تغيير كمية المنتج (+ أو -)
        function changeQty(id, change) {
            if (cart[id]) {
                cart[id].qty += change;
                if (cart[id].qty <= 0) {
                    delete cart[id];
                }
            }
            updateCart();
        }

        // حذف منتج بالكامل من السلة
        function removeFromCart(id) {
            delete cart[id];
            updateCart();
        }

        // تحديث واجهة السلة والإجمالي
        function updateCart() {
            const cartKeys = Object.keys(cart);
            let totalQty = 0;
            let totalPrice = 0;

            const cartItemsContainer = document.getElementById('cartItems');

            if (cartKeys.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: #94a3b8; text-align: center;">السلة فارغة حالياً.</p>';
            } else {
                let html = '';
                cartKeys.forEach(id => {
                    const item = cart[id];
                    totalQty += item.qty;
                    totalPrice += item.price * item.qty;

                    html += `
                        <div class="cart-item">
                            <img src="${item.image}" alt="${item.name}">
                            <div style="flex-grow: 1;">
                                <div><strong>${item.name}</strong></div>
                                <div style="color: var(--accent-color); font-size: 14px;">${item.price} ج.م</div>
                            </div>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                            </div>
                            <i class="fa-solid fa-trash" style="color: var(--main-color); cursor: pointer; margin-right: 10px;" onclick="removeFromCart(${item.id})"></i>
                        </div>
                    `;
                });
                cartItemsContainer.innerHTML = html;
            }

            document.getElementById('cartCount').innerText = totalQty;
            document.getElementById('cartTotal').innerText = totalPrice;
        }

        // فتح/إغلاق نافذة السلة
        function toggleCart() {
            const modal = document.getElementById('cartModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        // إرسال الطلب لسيفر الديسكورد
        function sendOrder() {
            if (Object.keys(cart).length === 0) {
                alert('السلة فارغة! قم بإضافة منتجات أولاً.');
                return;
            }
            alert('سيتم إحالتك الآن إلى سيرفر الديسكورد لإتمام عملية الشراء وتحويل المبلغ.');
            window.open('https://discord.gg/fYkwhjG3ns', '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
