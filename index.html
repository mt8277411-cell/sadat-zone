<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadat Zone | متجر الحسابات والألعاب</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #080810;
            --card-bg: #121225;
            --neon-blue: #00f3ff;
            --neon-pink: #ff007f;
            --neon-purple: #9d00ff;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px;
        }

        /* Neon Header */
        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(18, 18, 37, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px var(--neon-pink),
                0 0 30px var(--neon-pink),
                0 0 40px var(--neon-pink);
            animation: neonPulse 1.5s infinite alternate;
        }

        @keyframes neonPulse {
            from {
                text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-pink), 0 0 30px var(--neon-pink);
            }
            to {
                text-shadow: 0 0 2px #fff, 0 0 5px #fff, 0 0 15px var(--neon-blue), 0 0 25px var(--neon-blue);
            }
        }

        .subtitle {
            color: var(--neon-blue);
            font-size: 1.1rem;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* Layout Container */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .product-info {
            padding: 15px;
            text-align: center;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }

        .product-price {
            font-size: 1.3rem;
            color: var(--neon-blue);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .add-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            background: var(--neon-blue);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        /* Cart Sidebar */
        .cart-sidebar {
            background: var(--card-bg);
            border: 1px solid var(--neon-purple);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(157, 0, 255, 0.2);
            height: fit-content;
            position: sticky;
            top: 130px;
        }

        .cart-title {
            font-size: 1.4rem;
            color: var(--neon-purple);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .cart-items {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cart-item-details h4 {
            font-size: 0.95rem;
        }

        .cart-item-details p {
            font-size: 0.85rem;
            color: var(--neon-blue);
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--neon-pink);
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .remove-btn:hover {
            color: #ff4d4d;
            transform: scale(1.2);
        }

        .cart-summary {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }

        .total-price {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .whatsapp-input {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            margin-bottom: 10px;
            outline: none;
        }

        .whatsapp-input:focus {
            border-color: var(--neon-blue);
        }

        .checkout-btn {
            width: 100%;
            padding: 12px;
            background: #25d366;
            border: none;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(37, 211, 102, 0.4);
        }

        .checkout-btn:hover {
            background: #1ebc57;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.7);
        }

        .empty-cart {
            text-align: center;
            color: #888;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SADAT ZONE</div>
        <div class="subtitle">المتجر الأسطوري لشراء الحسابات والألعاب الإلكترونية</div>
    </header>

    <div class="container">
        <!-- Products Section -->
        <main class="products-grid" id="products-container">
            <!-- Dynamic Products Generated by JS -->
        </main>

        <!-- Cart Sidebar -->
        <aside class="cart-sidebar">
            <div class="cart-title">
                <i class="fa-solid font-shopping-cart"></i> سلة الشراء
            </div>
            
            <div class="cart-items" id="cart-items">
                <div class="empty-cart">السلة فارغة حالياً</div>
            </div>

            <div class="cart-summary">
                <div class="total-price">
                    <span>الإجمالي:</span>
                    <span id="total-amount" style="color: var(--neon-pink);">0 ج.م</span>
                </div>

                <input type="text" id="owner-whatsapp" class="whatsapp-input" placeholder="رقم واتساب صاحب المتجر (مثال: 2010xxxxxxx)">
                
                <button class="checkout-btn" onclick="sendToWhatsApp()">
                    <i class="fa-brands fa-whatsapp"></i> إرسال الطلب عبر واتساب
                </button>
            </div>
        </aside>
    </div>

    <script>
        // List of Products
        const products = [
            {
                id: 1,
                name: "حساب فايف ام (FiveM Account)",
                price: 150,
                image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 2,
                name: "لعبة GTA V Legacy",
                price: 200,
                image: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 3,
                name: "لعبة GTA Enhanced Edition",
                price: 350,
                image: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 4,
                name: "حساب Red Dead Redemption 2",
                price: 300,
                image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80"
            }
        ];

        let cart = [];

        // Render Products
        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.name}" class="product-img">
                    <div class="product-info">
                        <div class="product-title">${product.name}</div>
                        <div class="product-price">${product.price} ج.م</div>
                        <button class="add-btn" onclick="addToCart(${product.id})">
                            <i class="fa-solid fa-cart-plus"></i> إضافه للسلة
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Add item to cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                cartItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        // Remove item from cart
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        // Update Cart UI
        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const totalAmountEl = document.getElementById('total-amount');

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<div class="empty-cart">السلة فارغة حالياً</div>';
                totalAmountEl.innerText = '0 ج.م';
                return;
            }

            let total = 0;
            cartItemsContainer.innerHTML = cart.map(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                return `
                    <div class="cart-item">
                        <div class="cart-item-details">
                            <h4>${item.name}</h4>
                            <p>${item.price} × ${item.quantity} = ${itemTotal} ج.م</p>
                        </div>
                        <button class="remove-btn" onclick="removeFromCart(${item.id})">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
            }).join('');

            totalAmountEl.innerText = `${total} ج.م`;
        }

        // Send Order to WhatsApp
        function sendToWhatsApp() {
            const whatsappNumber = document.getElementById('owner-whatsapp').value.trim();

            if (!whatsappNumber) {
                alert('يرجى إدخال رقم الواتساب الخاص بك (صاحب المتجر) لإرسال الطلب إليه.');
                return;
            }

            if (cart.length === 0) {
                alert('السلة فارغة! يرجى إضافة ألعاب أو حسابات أولاً.');
                return;
            }

            let message = "🎮 *طلب جديد من متجر Sadat Zone* 🎮\n\n";
            message += "*تفاصيل الطلب:*\n";

            let total = 0;
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                message += `${index + 1}. ${item.name}\n   - الكمية: ${item.quantity}\n   - السعر: ${itemTotal} ج.م\n`;
            });

            message += `\n---------------------------\n`;
            message += `💰 *الإجمالي النهائي:* ${total} ج.م\n`;
            message += `---------------------------\n`;
            message += "يرجى تأكيد الطلب وإرسال تفاصيل الحساب/المنتج.";

            const encodedMessage = encodeURIComponent(message);
            const whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;
            window.open(whatsappURL, '_blank');
        }

        // Initialize Store
        renderProducts();
    </script>
</body>
</html>
