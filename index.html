<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadat Zone - Digital Store</title>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 1. شريط التنقل العلوي */
        header {
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
        }

        .logo-area h1 {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: #b0c4de;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #00d2ff;
        }

        .nav-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .cart-btn {
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid #00d2ff;
            color: #00d2ff;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: 0.3s;
            position: relative;
        }

        .cart-btn:hover {
            background: #00d2ff;
            color: #0b0f19;
        }

        .cart-count {
            background: #ff4757;
            color: #fff;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 50%;
            margin-right: 5px;
        }

        /* 2. قسم الهيدر الرئيسي (البانر) */
        .hero-banner {
            margin-top: 75px;
            position: relative;
            width: 100%;
            min-height: 380px;
            background: linear-gradient(rgba(11, 15, 25, 0.4), rgba(11, 15, 25, 0.8)), 
                        url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            border-bottom: 2px solid rgba(0, 210, 255, 0.2);
        }

        .hero-crown {
            font-size: 45px;
            color: #ffcc00;
            margin-bottom: -10px;
            filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.6));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .hero-main-title {
            font-size: 55px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.6), 0 0 40px rgba(0, 114, 255, 0.4);
            margin-bottom: 5px;
        }

        .hero-main-title span {
            color: #00d2ff;
        }

        .hero-sub-title {
            font-size: 16px;
            color: #00d2ff;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .hero-services-bar {
            background: linear-gradient(90deg, #0051ff, #00d2ff);
            color: #ffffff;
            padding: 10px 30px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }

        .hero-footer-text {
            font-size: 14px;
            color: #b0c4de;
            font-weight: 650;
            letter-spacing: 0.5px;
        }

        /* 3. حاوية الأقسام بالتصميم الجديد والصور المعبرة */
        .main-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .image-card {
            position: relative;
            height: 220px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(0, 114, 255, 0.4);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            transition: all 0.4s ease;
            text-align: center;
        }

        .image-card:hover {
            transform: translateY(-6px);
            border-color: #00d2ff;
            box-shadow: 0 15px 35px rgba(0, 210, 255, 0.3);
        }

        /* خلفيات الأقسام بصور مخصصة ومعبرة لكل قسم بدقة */
        .card-services {
            background: linear-gradient(to top, rgba(5, 10, 25, 0.92) 20%, rgba(5, 10, 25, 0.2)), 
                        url('https://images.unsplash.com/photo-1592840496694-26d035b52b48?auto=format&fit=crop&w=700&q=80') center/cover no-repeat;
        }

        .card-accounts {
            background: linear-gradient(to top, rgba(5, 10, 25, 0.92) 20%, rgba(5, 10, 25, 0.2)), 
                        url('https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=700&q=80') center/cover no-repeat;
        }

        .card-fivem {
            background: linear-gradient(to top, rgba(5, 10, 25, 0.92) 20%, rgba(5, 10, 25, 0.2)), 
                        url('https://images.unsplash.com/photo-1560253023-3ec5d502959f?auto=format&fit=crop&w=700&q=80') center/cover no-repeat;
        }

        .card-content-overlay {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .card-title-custom {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .browse-btn {
            background: linear-gradient(90deg, #0055ff, #0099ff);
            color: #fff;
            border: none;
            padding: 8px 25px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(0, 114, 255, 0.4);
            width: 80%;
        }

        .browse-btn:hover {
            background: linear-gradient(90deg, #0040cc, #0077cc);
            transform: scale(1.03);
        }

        /* 4. قائمة سلة المشتريات الجانبية */
        .cart-sidebar {
            position: fixed;
            top: 0;
            left: -400px;
            width: 380px;
            height: 100%;
            background: #121826;
            border-right: 1px solid rgba(0, 210, 255, 0.2);
            z-index: 2000;
            box-shadow: 5px 0 30px rgba(0,0,0,0.5);
            transition: 0.4s ease;
            display: flex;
            flex-direction: column;
            padding: 25px;
        }

        .cart-sidebar.open {
            left: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .cart-header h3 {
            font-size: 20px;
            color: #fff;
        }

        .close-cart {
            background: none;
            border: none;
            color: #ff4757;
            font-size: 22px;
            cursor: pointer;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cart-item {
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .cart-item-info h4 {
            font-size: 15px;
            color: #fff;
            margin-bottom: 4px;
        }

        .cart-item-info span {
            color: #00d2ff;
            font-size: 14px;
            font-weight: 700;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #ff4757;
            cursor: pointer;
            font-size: 16px;
        }

        .cart-footer {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
            margin-top: 15px;
        }

        .total-section {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .total-section span:last-child {
            color: #00d2ff;
        }

        .checkout-btn {
            width: 100%;
            background: #25d366;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .checkout-btn:hover {
            background: #1ebe5d;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1500;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        @media(max-width: 768px) {
            header { padding: 15px 20px; }
            .nav-links { display: none; }
            .hero-main-title { font-size: 32px; }
            .cart-sidebar { width: 100%; left: -100%; }
        }
    </style>
</head>
<body>

    <!-- 1. الشريط العلوي -->
    <header>
        <div class="logo-area">
            <h1>SADAT ZONE</h1>
        </div>
        <ul class="nav-links">
            <li><a href="#" class="active">الرئيسية</a></li>
            <li><a href="#">المتجر</a></li>
            <li><a href="#">العروض</a></li>
            <li><a href="#">خدمات</a></li>
            <li><a href="#">من نحن</a></li>
            <li><a href="#">تواصل معنا</a></li>
        </ul>
        <div class="nav-actions">
            <button class="cart-btn" id="openCartBtn">
                <i class="fa-solid fa-cart-shopping"></i> سلة المشتريات 
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <!-- 2. البانر الرئيسي -->
    <section class="hero-banner">
        <div class="hero-crown"><i class="fa-solid fa-crown"></i></div>
        <h1 class="hero-main-title">SADAT <span>ZONE</span></h1>
        <p class="hero-sub-title">GAME ACCOUNTS & DIGITAL SERVICES</p>
        <div class="hero-services-bar">حسابات - أكواد - خدمات - FiveM</div>
        <div class="hero-footer-text">« جودة . أمان . سرعة »</div>
    </section>

    <!-- 3. الأقسام الثلاثة بصور معبرة واحترافية -->
    <div class="main-container">
        <div class="categories-grid">
            
            <!-- القسم الأول: خدمات الألعاب -->
            <div class="image-card card-services">
                <div class="card-content-overlay">
                    <h3 class="card-title-custom">خدمات الألعاب</h3>
                    <button class="browse-btn add-to-cart" data-name="خدمات الألعاب" data-price="120">تصفح الآن</button>
                </div>
            </div>

            <!-- القسم الثاني: حسابات ألعاب -->
            <div class="image-card card-accounts">
                <div class="card-content-overlay">
                    <h3 class="card-title-custom">حسابات ألعاب</h3>
                    <button class="browse-btn add-to-cart" data-name="حسابات ألعاب" data-price="150">تصفح الآن</button>
                </div>
            </div>

            <!-- القسم الثالث: حسابات FiveM -->
            <div class="image-card card-fivem">
                <div class="card-content-overlay">
                    <h3 class="card-title-custom">حسابات FiveM</h3>
                    <button class="browse-btn add-to-cart" data-name="حسابات FiveM" data-price="100">تصفح الآن</button>
                </div>
            </div>

        </div>
    </div>

    <!-- نافذة سلة المشتريات الجانبية -->
    <div class="overlay" id="overlay"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>سلة المشتريات</h3>
            <button class="close-cart" id="closeCartBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items" id="cartItemsContainer">
            <p style="color: #888; text-align: center; margin-top: 30px;">السلة فارغة حالياً</p>
        </div>
        <div class="cart-footer">
            <div class="total-section">
                <span>الإجمالي:</span>
                <span id="cartTotal">0 جنيه</span>
            </div>
            <button class="checkout-btn" id="whatsappCheckoutBtn">
                <i class="fa-brands fa-whatsapp" style="font-size: 20px;"></i> إتمام الطلب عبر الواتساب
            </button>
        </div>
    </div>

    <!-- الجافاسكريبت -->
    <script>
        const cartBtn = document.getElementById('openCartBtn');
        const closeCartBtn = document.getElementById('closeCartBtn');
        const cartSidebar = document.getElementById('cartSidebar');
        const overlay = document.getElementById('overlay');
        const cartItemsContainer = document.getElementById('cartItemsContainer');
        const cartCount = document.getElementById('cartCount');
        const cartTotal = document.getElementById('cartTotal');
        const addToCartButtons = document.querySelectorAll('.add-to-cart');
        const whatsappCheckoutBtn = document.getElementById('whatsappCheckoutBtn');

        let cart = [];

        cartBtn.addEventListener('click', () => {
            cartSidebar.classList.add('open');
            overlay.classList.add('active');
        });

        closeCartBtn.addEventListener('click', closeCart);
        overlay.addEventListener('click', closeCart);

        function closeCart() {
            cartSidebar.classList.remove('open');
            overlay.classList.remove('active');
        }

        addToCartButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                const name = e.target.getAttribute('data-name');
                const price = parseFloat(e.target.getAttribute('data-price'));

                const existingItem = cart.find(item => item.name === name);
                if (existingItem) {
                    existingItem.quantity += 1;
                } else {
                    cart.push({ name, price, quantity: 1 });
                }

                updateCart();
                cartSidebar.classList.add('open');
                overlay.classList.add('active');
            });
        });

        function updateCart() {
            cartItemsContainer.innerHTML = '';
            let total = 0;
            let totalCount = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: #888; text-align: center; margin-top: 30px;">السلة فارغة حالياً</p>';
            } else {
                cart.forEach((item, index) => {
                    total += item.price * item.quantity;
                    totalCount += item.quantity;

                    const itemElement = document.createElement('div');
                    itemElement.classList.add('cart-item');
                    itemElement.innerHTML = `
                        <div class="cart-item-info">
                            <h4>${item.name} (${item.quantity})</h4>
                            <span>${item.price * item.quantity} جنيه</span>
                        </div>
                        <button class="remove-btn" onclick="removeItem(${index})"><i class="fa-solid fa-trash"></i></button>
                    `;
                    cartItemsContainer.appendChild(itemElement);
                });
            }

            cartCount.textContent = totalCount;
            cartTotal.textContent = total + ' جنيه';
        }

        window.removeItem = function(index) {
            cart.splice(index, 1);
            updateCart();
        }

        whatsappCheckoutBtn.addEventListener('click', () => {
            if (cart.length === 0) {
                alert('السلة فارغة! يرجى إضافة منتجات أولاً.');
                return;
            }

            let message = "مرحباً، أريد إتمام الطلب التالي من متجر Sadat Zone:\n\n";
            let total = 0;

            cart.forEach(item => {
                let itemTotal = item.price * item.quantity;
                total += itemTotal;
                message += `🔹 *${item.name}* (الكمية: ${item.quantity}) - السعر: ${itemTotal} جنيه\n`;
            });

            message += `\n💰 *المبلغ الإجمالي الكامل:* ${total} جنيه`;

            const phoneNumber = "201041180818";
            const encodedMessage = encodeURIComponent(message);
            const whatsappURL = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;
            window.open(whatsappURL, '_blank');
        });
    </script>

</body>
</html>
