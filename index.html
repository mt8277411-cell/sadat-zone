<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadat Zone - Digital Store</title>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 1. شريط التنقل العلوي */
        header {
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
        }

        .logo-area h1 {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: #b0c4de;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #00d2ff;
        }

        .nav-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .cart-btn {
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid #00d2ff;
            color: #00d2ff;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

        .cart-btn:hover {
            background: #00d2ff;
            color: #0b0f19;
        }

        .search-icon {
            color: #fff;
            cursor: pointer;
            font-size: 18px;
        }

        /* 2. قسم الهيدر الرئيسي (البانر) */
        .hero-banner {
            margin-top: 75px;
            position: relative;
            width: 100%;
            min-height: 380px;
            background: linear-gradient(rgba(11, 15, 25, 0.4), rgba(11, 15, 25, 0.8)), 
                        url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            border-bottom: 2px solid rgba(0, 210, 255, 0.2);
        }

        .hero-crown {
            font-size: 45px;
            color: #ffcc00;
            margin-bottom: -10px;
            filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.6));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .hero-main-title {
            font-size: 55px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.6), 0 0 40px rgba(0, 114, 255, 0.4);
            margin-bottom: 5px;
        }

        .hero-main-title span {
            color: #00d2ff;
        }

        .hero-sub-title {
            font-size: 16px;
            color: #00d2ff;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .hero-services-bar {
            background: linear-gradient(90deg, #0051ff, #00d2ff);
            color: #ffffff;
            padding: 10px 30px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }

        .hero-footer-text {
            font-size: 14px;
            color: #b0c4de;
            font-weight: 650;
            letter-spacing: 0.5px;
        }

        /* 3. حاوية الأقسام الثلاثة الكبرى (Services Grid) */
        .main-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .category-card {
            background: linear-gradient(145deg, #131b2e, #0d1322);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 16px;
            padding: 35px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* تأثير إضاءة خلفي خفيف عند مرور الماوس */
        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top, rgba(0, 210, 255, 0.15), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .category-card:hover {
            transform: translateY(-8px);
            border-color: #00d2ff;
            box-shadow: 0 15px 40px rgba(0, 210, 255, 0.25);
        }

        .category-card:hover::before {
            opacity: 1;
        }

        .category-icon {
            font-size: 48px;
            color: #00d2ff;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.4));
            transition: transform 0.3s ease;
        }

        .category-card:hover .category-icon {
            transform: scale(1.1);
        }

        .category-title {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .category-btn {
            background: linear-gradient(45deg, #0072ff, #00c6ff);
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
        }

        .category-btn:hover {
            background: linear-gradient(45deg, #005bb5, #0099cc);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5);
            transform: scale(1.05);
        }

        /* التجاوب مع الموبايل */
        @media(max-width: 768px) {
            header {
                padding: 15px 20px;
            }
            .nav-links {
                display: none;
            }
            .hero-main-title {
                font-size: 32px;
            }
            .hero-services-bar {
                font-size: 13px;
                padding: 8px 15px;
            }
            .category-card {
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>

    <!-- 1. الشريط العلوي -->
    <header>
        <div class="logo-area">
            <h1>SADAT ZONE</h1>
        </div>
        <ul class="nav-links">
            <li><a href="#" class="active">الرئيسية</a></li>
            <li><a href="#">المتجر</a></li>
            <li><a href="#">العروض</a></li>
            <li><a href="#">خدمات</a></li>
            <li><a href="#">من نحن</a></li>
            <li><a href="#">تواصل معنا</a></li>
        </ul>
        <div class="nav-actions">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <button class="cart-btn">
                <i class="fa-solid fa-cart-shopping"></i> سلة المشتريات
            </button>
        </div>
    </header>

    <!-- 2. البانر الرئيسي -->
    <section class="hero-banner">
        <div class="hero-crown">
            <i class="fa-solid fa-crown"></i>
        </div>
        <h1 class="hero-main-title">SADAT <span>ZONE</span></h1>
        <p class="hero-sub-title">GAME ACCOUNTS & DIGITAL SERVICES</p>
        <div class="hero-services-bar">
            حسابات - أكواد - خدمات - FiveM
        </div>
        <div class="hero-footer-text">
            « جودة . أمان . سرعة »
        </div>
    </section>

    <!-- 3. الأقسام الثلاثة الكبرى السلسة -->
    <div class="main-container">
        <div class="categories-grid">
            
            <!-- القسم الأول: خدمات الألعاب -->
            <div class="category-card">
                <div class="category-icon">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <h3 class="category-title">خدمات الألعاب</h3>
                <button class="category-btn">تصفح الآن</button>
            </div>

            <!-- القسم الثاني: حسابات ألعاب -->
            <div class="category-card">
                <div class="category-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h3 class="category-title">حسابات ألعاب</h3>
                <button class="category-btn">تصفح الآن</button>
            </div>

            <!-- القسم الثالث: حسابات FiveM -->
            <div class="category-card">
                <div class="category-icon">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h3 class="category-title">حسابات FiveM</h3>
                <button class="category-btn">تصفح الآن</button>
            </div>

        </div>
    </div>

</body>
</html>
