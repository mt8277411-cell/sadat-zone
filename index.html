<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الألعاب - God of War Ragnarok</title>
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .product-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            padding-bottom: 20px;
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .product-info {
            padding: 15px;
        }
        .product-title {
            font-size: 22px;
            margin-bottom: 10px;
            color: #f39c12;
        }
        .product-price {
            font-size: 18px;
            color: #2ecc71;
            margin-bottom: 15px;
        }
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 15px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.3s ease;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .cart-btn {
            background-color: #27ae60;
            color: #ffffff;
        }
        .discord-btn {
            background-color: #5865F2;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="product-card">
        <img src="https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?auto=format&fit=crop&q=80&w=500" alt="God of War Ragnarok">
        <div class="product-info">
            <div class="product-title">God of War Ragnarok</div>
            <div class="product-price">$59.99</div>
        </div>
        <div class="buttons-container">
            <a href="#" class="btn cart-btn">
                <i class="fas fa-shopping-cart"></i> أضف إلى السلة
            </a>
            <a href="https://discord.gg/fYkwhjG3ns" target="_blank" class="btn discord-btn">
                <i class="fab fa-discord"></i> انضم إلينا على ديسكورد
            </a>
        </div>
    </div>

</body>
</html>
